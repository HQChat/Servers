## EMQX config for the transport benchmark ONLY — not a deployment artifact.
##
## It differs from infra/deploy/emqx/emqx.conf in exactly two ways, both
## deliberate:
##
##   1. ALL FOUR listeners are on, where production enables `ws` alone. The
##      whole point is to put mqtts (1) and MQTT-over-WSS (2) side by side on
##      one broker, so the only variable is the transport.
##   2. No authn/authz. Production POSTs every CONNECT to the auth server and
##      reads the topic ACL from Postgres; both cost the same on every
##      transport, so including them would add the same constant to each arm
##      and a Postgres round trip's worth of variance on top. Connect numbers
##      here are therefore transport-only and LOWER than production's — see
##      README.md, "What this does not measure".
node {
  name = "emqx@127.0.0.1"
  cookie = "bench-cookie"
  data_dir = "/opt/emqx/data"
}

## The client reaches these over a veth pair, not loopback, so netem can
## impair the client<->broker path without touching the broker's own
## 127.0.0.1 Erlang distribution traffic.
listeners.tcp.default { bind = "0.0.0.0:1883" }

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    certfile = "/bench/certs/server.pem"
    keyfile  = "/bench/certs/server.key"
  }
}

listeners.wss.default {
  bind = "0.0.0.0:8084"
  websocket.mqtt_path = "/mqtt"
  ssl_options {
    certfile = "/bench/certs/server.pem"
    keyfile  = "/bench/certs/server.key"
  }
}

authorization { no_match = allow }

log {
  console { enable = true, level = warning }
  file { enable = false }
}
