# nginx for the transport benchmark. The /mqtt location is copied from
# infra/deploy/nginx.conf so the production arm measures the production
# proxy behaviour (HTTP/1.1 Upgrade, the same timeouts, the same headers),
# not a simplified stand-in. TLS is a self-signed cert on 8443 instead of
# the Cloudflare origin cert; the handshake cost is the same shape.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  error_log /dev/stderr warn;

  server {
    listen 8443 ssl;
    http2 off;
    server_name bench.local;

    ssl_certificate     /bench/certs/server.pem;
    ssl_certificate_key /bench/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /mqtt {
      proxy_pass http://127.0.0.1:8083;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
